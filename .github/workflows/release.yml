name: Release Bald

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bald-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify Rust Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run pure Rust regressions without desktop resources
        run: pwsh -NoProfile -File tools/windows/test-pure.ps1

      - name: Run Rust regressions on an isolated desktop
        run: pwsh -NoProfile -File tools/windows/test-isolated.ps1 -Mode suite

      - name: Run isolated worker lifecycle regression
        run: pwsh -NoProfile -File tools/windows/test-isolated.ps1 -Mode worker

      - name: Check release compilation
        run: cargo check --release

      - name: Verify JavaScript lint
        run: npm run lint

      - name: Run JavaScript regressions
        run: npm test

      - name: Build, sign, and stage release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bald ${{ github.ref_name }}'
          releaseBody: 'Bald ${{ github.ref_name }} 릴리스'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Verify Windows installer lifecycle
        # The release owner will manually reinstall and check v0.1.5.
        if: github.ref_name != 'v0.1.5'
        run: npm run verify:installer

      - name: Publish release
        run: gh release edit "$env:RELEASE_TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Publish update manifest
        run: node publish-update.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit update manifest
        shell: bash
        run: |
          cp update.json "$RUNNER_TEMP/update.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/update.json" update.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --staged --quiet || git commit -m "chore: update update.json for ${{ github.ref_name }}"
          git push origin HEAD:main
