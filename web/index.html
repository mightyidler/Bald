<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bald</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app" id="homePage">
  <div class="app-surface" aria-hidden="true"></div>
  <header class="header" data-tauri-drag-region>
    <div class="header-logo" data-tauri-drag-region><img class="logo-icon" src="figma/app-icon.png" alt=""><div class="logo-text" data-tauri-drag-region><strong>Bald</strong><span>Border Ablation Layout Decoupling</span></div></div>
    <div class="header-actions"><button class="icon-btn" id="minimizeBtn"><img src="figma/minus.svg" alt="최소화"></button><button class="icon-btn" id="closeBtn"><img src="figma/close.svg" alt="닫기"></button></div>
  </header>
  <main class="main">
    <div class="content-stack">
      <section class="section"><div class="section-label" data-i18n="applications">애플리케이션</div><div class="card" id="applications"></div></section>
      <section class="section"><div class="section-label" data-i18n="settings">설정</div><div class="card">
        <div class="setting-row"><div class="setting-copy"><strong data-i18n="automatic">자동 적용</strong><span data-i18n="automaticDesc">등록한 애플리케이션에 테두리를 자동으로 제거합니다</span></div><label class="toggle"><input id="automaticToggle" type="checkbox"><span class="toggle-track"></span><span class="toggle-knob"></span></label></div>
        <div class="divider inset"></div>
        <div class="setting-row"><div class="setting-copy"><strong data-i18n="startup">Windows 시작 시 자동 실행</strong><span data-i18n="startupDesc">로그인할 때 Bald를 자동으로 실행합니다</span></div><label class="toggle"><input id="startupToggle" type="checkbox"><span class="toggle-track"></span><span class="toggle-knob"></span></label></div>
      </div></section>
      <section class="section"><div class="section-label" data-i18n="environment">환경</div><div class="card">
        <div class="select-row"><strong data-i18n="language">표시 언어</strong><div class="dropdown-wrap" id="languageDropdown"><button class="dropdown-trigger"><span id="languageValue">한국어</span><img class="chevron" src="figma/chevron.svg" alt=""></button><div class="dropdown-menu"><button class="dropdown-item" data-language="korean">한국어<img class="check-icon" src="figma/check.svg" alt=""></button><button class="dropdown-item" data-language="english">English<img class="check-icon" src="figma/check.svg" alt=""></button></div></div></div>
        <div class="divider inset"></div>
        <div class="select-row"><strong data-i18n="theme">테마</strong><div class="dropdown-wrap" id="themeDropdown"><button class="dropdown-trigger"><span id="themeValue">시스템</span><img class="chevron" src="figma/chevron.svg" alt=""></button><div class="dropdown-menu"><button class="dropdown-item" data-theme="system"><span data-i18n="themeSystem">시스템</span><img class="check-icon" src="figma/check.svg" alt=""></button><button class="dropdown-item" data-theme="light"><span data-i18n="themeLight">라이트</span><img class="check-icon" src="figma/check.svg" alt=""></button><button class="dropdown-item" data-theme="dark"><span data-i18n="themeDark">다크</span><img class="check-icon" src="figma/check.svg" alt=""></button></div></div></div>
      </div></section>
      <section class="section"><div class="section-label" data-i18n="updates">업데이트</div><div class="card">
        <div class="select-row"><strong data-i18n="currentVersion">현재 버전</strong><span class="version-value" id="appVersion">확인 중...</span></div>
        <div class="divider inset"></div>
        <button class="update-row" id="checkUpdateBtn"><span data-i18n="checkUpdate">업데이트 확인</span><span class="update-status" id="updateStatus"></span></button>
      </div></section>
    </div>
    <div class="action-card card"><button class="action danger" id="resetBtn" data-i18n="reset">설정 초기화</button><div class="divider inset"></div><button class="action" id="exitBtn" data-i18n="exit">Bald 종료</button></div>
  </main>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="dim" id="dim"></div>
  <section class="picker" id="picker" aria-hidden="true">
    <div class="picker-fixed">
      <div class="picker-surface">
        <div class="picker-head"><strong data-i18n="addApplication">애플리케이션 추가</strong><button class="icon-btn" id="pickerClose"><img src="figma/close.svg" alt="닫기"></button></div>
        <div class="search-container"><div class="search"><img src="figma/search.svg" alt=""><input id="pickerSearch" data-i18n-placeholder="search" placeholder="실행 중인 애플리케이션 검색"></div></div>
      </div>
    </div>
    <div class="picker-list" id="pickerList"></div>
  </section>
</div>
<script src="app.js"></script></body></html>
